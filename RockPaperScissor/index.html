<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rock Paper Scissor</title>
</head>

<body>
    <main>
        <h1>Rock Paper Scissor</h1>
        <div class="choices">
            <div class="choice" id="rock">
                <img src="rock.jpg">
            </div>
            <div class="choice" id="paper">
                <img src="paper.jpg">
            </div>
            <div class="choice" id="scissor">
                <img src="scissor.jpg">
            </div>
        </div>

        <div class="score-card">
            <div class="score">
                <p id="user-score">0</p>
                <p>You</p>
            </div>
            <div class="score">
                <p id="draw-score">0</p>
                <p>Draw</p>
            </div>
            <div class="score">
                <p id="comp-score">0</p>
                <p>Comp</p>
            </div>
        </div>

        <div class="result">
            <p id="msg">Pick your move</p>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
